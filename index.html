<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KY Aesthetic · Medical aesthetics in Ottawa</title>
<meta name="description" content="Lip augmentation, anti-wrinkle injections, EndyMed RF lifting and skin boosters with cosmetologist Kateryna Yaryhina. 69 Kempster Ave, Ottawa. Book online.">
<meta property="og:title" content="KY Aesthetic · Kateryna Yaryhina">
<meta property="og:description" content="Medical aesthetics in Ottawa: lips, Botox, RF lifting, skin boosters.">
<meta property="og:image" content="https://ky-aesthetic.ca/images/kateryna-hero.webp">
<meta property="og:url" content="https://ky-aesthetic.ca/">
<meta name="theme-color" content="#111010">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,300;0,6..96,400;1,6..96,300;1,6..96,400&family=Playfair+Display:ital,wght@0,400;1,400&family=Montserrat:wght@300;400;500&display=swap">
<style>
/* Layout: after nevyostudio.com — near-black ground, Bodoni caps with wide tracking in warm sand, thin Montserrat; hairlines, slow reveals, custom cursor. Top treatments as a full-bleed mosaic after coastarchitects.pl. Single dark theme by design. */
:root{
  --bg:#111010; --bg2:#151414; --card:rgba(30,28,26,.5);
  --ink:#EDE9E3; --soft:rgba(237,233,227,.82); --muted:rgba(237,233,227,.52);
  --sand:#C8B8A0; --line:rgba(200,184,160,.15); --line2:rgba(200,184,160,.3);
  --serif:"Bodoni Moda","Playfair Display",Didot,"Times New Roman",serif;
  --sans:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:.95rem;line-height:1.9;letter-spacing:.03em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;font-weight:300;text-wrap:balance}
p{margin:0}
::selection{background:var(--sand);color:var(--bg)}
:focus-visible{outline:1px solid var(--sand);outline-offset:4px}
/* grid after nevyostudio.com: 1400px content, side gutter 20→40px, section rhythm 72→128px */
:root{--gut:clamp(20px,4vw,40px);--sec:clamp(72px,9vw,128px)}
.wrap{max-width:calc(1400px + 2 * var(--gut));margin:0 auto;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.cap{font-family:var(--sans);font-weight:400;font-size:.72rem;letter-spacing:.24em;text-transform:uppercase}
.muted{color:var(--muted)}
.serif{font-family:var(--serif)}
.H{font-family:var(--serif);font-weight:300;text-transform:uppercase;letter-spacing:.14em;color:var(--sand);line-height:1.15}
.it{font-family:var(--serif);font-style:italic;font-weight:300}
section.band{padding-block:var(--sec)}

/* line-mask reveal for big headings */
.ln{display:block;overflow:hidden;padding-bottom:.08em}
.ln>span{display:block;transform:translateY(105%);transition:transform 1.3s var(--ease)}
.in .ln>span,.ln.in>span{transform:none}
.in .ln:nth-child(2)>span{transition-delay:.12s}.in .ln:nth-child(3)>span{transition-delay:.24s}.in .ln:nth-child(4)>span{transition-delay:.36s}
/* fade-up reveal */
.js [data-r]{opacity:0;transform:translateY(34px);transition:opacity 1.1s ease,transform 1.3s var(--ease)}
.js [data-r].in{opacity:1;transform:none}
.js [data-r="2"]{transition-delay:.12s}.js [data-r="3"]{transition-delay:.24s}.js [data-r="4"]{transition-delay:.36s}
/* image wipe reveal */
.wipe{position:relative;overflow:hidden}
.wipe::after{content:"";position:absolute;inset:0;background:var(--bg);transform-origin:right center;transition:transform 1.5s var(--ease);z-index:3;pointer-events:none}
.wipe.in::after{transform:scaleX(0)}
.no-anim .ln>span,.no-anim [data-r]{transform:none!important;opacity:1!important}
.no-anim .wipe::after{display:none}

/* preloader */
#pre{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .8s ease,visibility .8s}
#pre.done{opacity:0;visibility:hidden}
#pre .box{display:grid;gap:22px;justify-items:center}
#pre .mono{font-family:var(--serif);font-size:3rem;color:var(--sand);letter-spacing:.04em;line-height:1}
#pre .bar{width:160px;height:1px;background:rgba(200,184,160,.15);overflow:hidden}
#pre .bar i{display:block;height:100%;width:0;background:var(--sand);animation:fill 1.1s var(--ease) forwards}
@keyframes fill{to{width:100%}}

/* custom cursor */
.cur,.cur-ring{position:fixed;left:0;top:0;pointer-events:none;z-index:90;border-radius:50%}
.cur{width:8px;height:8px;margin:-4px 0 0 -4px;background:var(--sand);box-shadow:0 0 18px 6px rgba(200,184,160,.18)}
.cur-ring{width:38px;height:38px;margin:-19px 0 0 -19px;border:1px solid rgba(200,184,160,.45);transition:width .35s var(--ease),height .35s var(--ease),margin .35s var(--ease),border-color .3s,background .3s}
.cur-ring.hov{width:66px;height:66px;margin:-33px 0 0 -33px;border-color:var(--sand);background:rgba(200,184,160,.06)}
@media (pointer:coarse){.cur,.cur-ring{display:none}}

/* buttons & links */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;font-family:var(--sans);font-weight:400;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);padding:15px 30px;border:1px solid rgba(237,233,227,.55);border-radius:2px;background:transparent;cursor:pointer;transition:background .35s,color .35s,border-color .35s}
.btn:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.solid{background:var(--sand);border-color:var(--sand);color:#15120F}
.btn.solid:hover{background:var(--ink);border-color:var(--ink)}
.circ{display:inline-flex;align-items:center;gap:0;position:relative;padding:22px 74px 22px 0;font-family:var(--sans);font-weight:400;font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--soft);background:none;border:0;cursor:pointer}
.circ::before{content:"";position:absolute;left:0;right:30px;top:50%;height:1px;background:rgba(237,233,227,.35);transform:translateY(12px)}
.circ::after{content:"";position:absolute;right:0;top:50%;width:66px;height:66px;margin-top:-33px;border:1px solid var(--line2);border-radius:50%;transition:transform .5s var(--ease),border-color .3s}
.circ:hover{color:var(--ink)}
.circ:hover::after{transform:scale(1.12);border-color:var(--sand)}
.circ .ar{position:absolute;right:24px;top:50%;transform:translateY(8px);width:16px;height:1px;background:currentColor}
.circ .ar::after{content:"";position:absolute;right:0;top:-3px;width:6px;height:6px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
.ul{background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .5s var(--ease);padding-bottom:3px}
.ul:hover,.ul[aria-current="page"]{background-size:100% 1px}

/* header */
header.top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(17,16,16,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(200,184,160,.08)}
.hb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding-block:18px}
.navl{display:flex;gap:30px;align-items:center}
.navl a{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(237,233,227,.82)}
.navl a:hover{color:var(--ink)}
.logo{display:inline-flex;align-items:center;gap:12px;justify-self:center;color:var(--sand)}
.logo .m{font-family:var(--serif);font-size:1.55rem;line-height:1;letter-spacing:.02em}
.logo .w{font-size:.68rem;letter-spacing:.38em;text-transform:uppercase}
.top .logo{gap:13px}.top .logo .m{font-size:1.7rem}.top .logo .w{font-size:.75rem}
.navr{justify-self:end;display:flex;align-items:center;gap:22px}
.navr .tel{font-size:.74rem;letter-spacing:.1em;color:rgba(237,233,227,.72)}
.lang{display:flex;gap:6px;align-items:center;font-size:.7rem;letter-spacing:.12em;color:var(--muted)}
.lang button{background:none;border:0;color:var(--muted);font:inherit;letter-spacing:inherit;cursor:pointer;padding:2px 0}
.lang button[aria-pressed="true"]{color:var(--sand);box-shadow:0 1px 0 var(--sand)}
.navr .btn{padding:10px 20px;font-size:.66rem}
.burger{display:none;background:none;border:0;color:var(--ink);cursor:pointer;padding:6px 0;width:28px}
.burger i{display:grid;gap:6px}
.burger i::before,.burger i::after{content:"";height:1px;background:currentColor;display:block}
@media (max-width:1060px){.navr .tel{display:none}}
@media (max-width:900px){.navl{display:none}.burger{display:block}.navr .btn{display:none}.hb{grid-template-columns:auto 1fr auto}.logo{justify-self:center}}

.overlay{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-y:auto}
.overlay nav{display:grid;align-content:center;gap:2px;padding-block:24px}
.overlay nav a{font-family:var(--serif);font-weight:300;font-size:clamp(1.6rem,4.4vw,2.6rem);text-transform:uppercase;letter-spacing:.12em;color:var(--sand);width:fit-content;line-height:1.35;opacity:.75;transition:opacity .3s,letter-spacing .5s var(--ease)}
.overlay nav a:hover,.overlay nav a[aria-current="page"]{opacity:1;letter-spacing:.16em}
.overlay nav a small{font-family:var(--sans);font-size:.62rem;letter-spacing:.2em;color:var(--muted);margin-right:18px;vertical-align:middle}
.xbtn{position:relative;justify-self:end;width:44px;height:44px;margin-right:-10px;background:none;border:0;color:var(--ink);cursor:pointer;padding:0}
.xbtn::before,.xbtn::after{content:"";position:absolute;left:11px;top:21px;width:22px;height:1px;background:currentColor;transform:rotate(45deg);transition:transform .5s var(--ease),background .3s}
.xbtn::after{transform:rotate(-45deg)}
.xbtn:hover{color:var(--sand)}.xbtn:hover::before{transform:rotate(135deg)}.xbtn:hover::after{transform:rotate(45deg)}
.overlay .ohb{grid-template-columns:1fr auto 1fr!important;width:100%;max-width:calc(1400px + 2 * var(--gut))}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--bg)}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;align-items:end;min-height:min(100vh,1000px);padding-top:76px}
.hero-txt{display:grid;gap:30px;justify-items:start;align-self:center;padding-block:60px}
.hero .eyebrow{font-size:.68rem;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.66)}
.hero h1{font-size:clamp(2.1rem,4.3vw,3.7rem)}
.hero .sub{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(1.15rem,1.8vw,1.45rem);color:var(--soft);letter-spacing:.02em}
.hero .acts{display:flex;align-items:center;gap:34px;flex-wrap:wrap}
.hero .who{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.hero-photo{justify-self:start;align-self:end;display:flex;min-width:0;padding-left:clamp(12px,2vw,32px)}
.hero-photo img{display:block;height:clamp(520px,calc((100vh - 76px) * .93),855px);width:auto;max-width:none;opacity:0;transform:scale(1.03);transition:opacity 1.8s ease .3s,transform 2.4s var(--ease) .3s;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 5%,#000 84%,transparent);mask-image:linear-gradient(to bottom,transparent 0,#000 5%,#000 84%,transparent)}
.hero.in .hero-photo img,.no-anim .hero-photo img{opacity:1;transform:none}
.scroll{position:absolute;left:50%;bottom:26px;width:1px;height:56px;background:rgba(200,184,160,.18);overflow:hidden}
.scroll::after{content:"";position:absolute;left:0;top:-40%;width:100%;height:40%;background:var(--sand);animation:drip 2.4s var(--ease) infinite}
@keyframes drip{to{top:100%}}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;min-height:0;padding-top:70px}.hero-photo{order:-1;justify-self:center;margin-right:0;padding-left:0}.hero-photo img{height:auto;width:min(100%,460px);max-width:100%}.hero-txt{justify-items:center;text-align:center;padding-block:0 80px}.hero .acts{justify-content:center}.scroll{display:none}}

/* quote */
.quote{display:grid;justify-items:center;text-align:center;gap:34px}
.quote .vline{width:1px;height:90px;background:linear-gradient(var(--sand),transparent)}
.quote blockquote{margin:0;max-width:30ch;font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(1.55rem,3.1vw,2.6rem);line-height:1.45;color:var(--ink);letter-spacing:.01em}
.quote blockquote::before{content:"“";display:block;font-style:normal;text-align:center;font-size:3.4em;line-height:.6;color:var(--sand);opacity:.6;margin-bottom:.15em}
.quote .by{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.quote .by b{font-weight:400;color:var(--sand)}

/* section heads */
.shead{display:grid;justify-items:center;text-align:center;gap:20px;margin-bottom:clamp(48px,6vw,72px)}
.shead h2{font-size:clamp(1.9rem,3.6vw,3rem)}
.shead p{max-width:56ch;color:var(--muted)}
.row-lab{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-bottom:22px}
.row-lab span,.row-lab a{font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--soft);display:inline-flex;align-items:center;gap:14px}
.row-lab span::before{content:"";width:28px;height:1px;background:var(--sand)}
.row-lab a::after{content:"→";letter-spacing:0;transition:transform .4s var(--ease)}
.row-lab a:hover::after{transform:translateX(6px)}

/* top treatments mosaic (after coastarchitects.pl) */
.mosaic{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--bg)}
.mt{position:relative;display:block;overflow:hidden;height:clamp(380px,68vh,700px);background:#1a1817;color:#fff}
.mt.full{grid-column:1/-1}
.mt.half{height:clamp(340px,58vh,600px)}
.mt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.6s var(--ease)}
/* the four photos are colour-matched in the files themselves (shared warm balance, slightly deeper tones, ~8% less saturation) */
.mt:hover img{transform:scale(1.045)}
.mt .ov{position:absolute;inset:0;background:rgba(10,10,10,.5);opacity:0;transition:opacity .6s ease;z-index:1}
.mt:hover .ov,.mt:focus-visible .ov{opacity:1}
.mt .num{position:absolute;left:22px;top:18px;z-index:2;font-size:.66rem;letter-spacing:.2em;color:rgba(255,255,255,.75)}
.mt .cap2{position:absolute;inset:0;z-index:2;display:grid;place-content:center;justify-items:center;text-align:center;gap:12px;padding:24px;opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .8s var(--ease)}
.mt:hover .cap2,.mt:focus-visible .cap2{opacity:1;transform:none}
.mt h3{font-family:var(--serif);font-weight:300;text-transform:uppercase;letter-spacing:.14em;font-size:clamp(1.5rem,2.8vw,2.4rem);line-height:1.15}
.mt .cap2 span{font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.82)}
.mt .cap2 em{font-family:var(--serif);font-style:italic;font-size:1.05rem;letter-spacing:.02em;color:var(--sand)}
.mt .lbl{position:absolute;left:22px;bottom:20px;z-index:2;font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.9);transition:opacity .5s}
.mt:hover .lbl{opacity:0}
@media (hover:none){.mt .ov{opacity:.42}.mt .cap2{opacity:1;transform:none}.mt .lbl{display:none}}
@media (max-width:760px){.mosaic{grid-template-columns:1fr}.mt,.mt.half{height:clamp(320px,62vh,520px)}}

/* approach timeline (after nevyo "Design process") */
.proc{display:grid;grid-template-columns:5fr 7fr;gap:clamp(40px,7vw,110px);align-items:start}
.proc h2{font-size:clamp(2rem,4vw,3.2rem);position:sticky;top:130px}
.proc>div:last-child{justify-self:end;width:min(100%,660px)}.proc .tl p{max-width:none}
.tl{position:relative;display:grid;gap:clamp(48px,6vw,72px);padding-left:44px}
.tl::before{content:"";position:absolute;left:5px;top:12px;bottom:12px;width:1px;background:var(--line2)}
.tl article{position:relative;display:grid;gap:14px}
.tl article::before{content:"";position:absolute;left:-44px;top:20px;width:11px;height:11px;border-radius:50%;border:1px solid var(--sand);background:var(--bg);transition:background .6s}
.tl article.in::before{background:var(--sand)}
.tl .hd{display:flex;align-items:baseline;gap:18px}
.tl .n{font-family:var(--serif);font-weight:300;font-size:3.4rem;line-height:1;color:rgba(237,233,227,.28)}
.tl h3{font-family:var(--serif);font-weight:400;font-size:1.7rem;letter-spacing:.08em;color:var(--sand)}
.tl p{color:var(--soft);font-size:.86rem;max-width:58ch}
@media (max-width:860px){.proc{grid-template-columns:1fr}.proc h2{position:static}.proc>div:last-child{justify-self:stretch;width:auto}}

/* let's meet */
.meet{display:grid;grid-template-columns:1fr 1fr;gap:clamp(40px,8vw,120px);align-items:center}
.meet .txt{display:grid;gap:26px}
.meet h2{font-size:clamp(1.9rem,3.6vw,2.8rem)}
.meet .q{font-family:var(--serif);font-style:italic;font-weight:300;font-size:1.4rem;line-height:1.55;color:var(--ink)}
.meet p{color:var(--soft);text-align:justify;hyphens:auto}
.meet .pic{position:relative;aspect-ratio:4/5;background:radial-gradient(70% 55% at 50% 38%,#2A2421 0%,#171414 62%,#100F0F 100%);border:1px solid var(--line);overflow:hidden}
.meet .pic img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:96%;width:auto;max-width:none}
.meet .pic.photo{background:#E9E9EA}
.meet .pic.photo img{left:0;top:0;transform:none;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.meet .pic .ring{position:absolute;right:22px;top:22px;width:34px;height:34px;border:1px solid var(--line2);border-radius:50%;z-index:2}
@media (max-width:860px){.meet{grid-template-columns:1fr}.meet .pic{order:-1}}

/* cards (after nevyo pricing cards) */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
@media (max-width:900px){.cards3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:40px 32px;display:grid;gap:18px;align-content:start;transition:border-color .5s,transform .8s var(--ease)}
.card:hover{border-color:var(--line2);transform:translateY(-4px)}
.card h3{font-family:var(--serif);font-weight:300;text-transform:uppercase;letter-spacing:.16em;font-size:1.45rem;color:var(--sand);text-align:center}
.card .sub{font-family:var(--serif);font-style:italic;text-align:center;color:var(--soft)}
.card blockquote{margin:0;font-family:var(--serif);font-style:italic;font-weight:300;font-size:1.12rem;line-height:1.7;color:var(--ink)}
.card .lbl{font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}

/* contact (after nevyo) */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:clamp(40px,7vw,110px);align-items:start}
.big{font-family:var(--serif);font-style:italic;font-weight:400;text-transform:uppercase;font-size:clamp(2.1rem,4.6vw,4rem);line-height:1.08;color:var(--sand);opacity:.85}
.big .ln:nth-child(2){padding-left:1.4em}.big .ln:nth-child(3){padding-left:1.4em}
.contact .small{margin-top:36px;font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;line-height:2.1;color:var(--soft);max-width:26ch}
.form{display:grid;gap:8px}
.form input[type=text],.form input[type=email],.form input[type=tel],.form textarea{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(237,233,227,.18);color:var(--ink);font:inherit;font-size:.9rem;padding:16px 0 12px;border-radius:0;transition:border-color .4s}
.form textarea{min-height:110px;resize:vertical}
.form input::placeholder,.form textarea::placeholder{color:rgba(237,233,227,.4)}
.form input:focus,.form textarea:focus{outline:none;border-bottom-color:var(--sand)}
.form .chk{display:flex;gap:12px;align-items:flex-start;margin-top:18px;font-size:.78rem;color:var(--muted)}
.form .chk input{width:15px;height:15px;margin-top:3px;accent-color:var(--sand)}
.form .note{font-size:.82rem;color:var(--sand)}
@media (max-width:860px){.contact{grid-template-columns:1fr}}
/* contacts: details + dark-toned map */
.visit{display:grid;align-content:start;padding-top:10px}
.visit>.cap{margin-bottom:14px}
.vrow{display:grid;grid-template-columns:minmax(110px,150px) 1fr;align-items:center;gap:20px;padding:26px 0;border-bottom:1px solid rgba(237,233,227,.18);color:var(--ink);transition:padding .5s var(--ease)}

  <div class="cgrid">${list.map((c,i)=>`<button type="button" class="cert" data-ci="${certs.indexOf(c)}" data-r="${(i%4)+1}" aria-label="${L(c[2])}"><span class="cframe"><img src="${csrc(c[0])}" alt="${L(c[2])}" loading="lazy"></span><span class="cmeta">${c[3]} · ${L(c[4])}</span><span class="ct">${L(c[2])}</span></button>`).join("")}</div>`);},
 results:()=>page("results",T().resultsLead,true,
  `<div class="tabs" role="group">${["all","lips","botox","rf"].map(f=>`<button type="button" data-f="${f}" aria-pressed="${filter===f}">${f==="all"?T().all2:L(svcs.find(s=>s.id===f).mark)}</button>`).join("")}</div>
  <div class="grid3">${results.filter(r=>filter==="all"||r[0]===filter).map((r,i)=>`<div class="tile" data-r="${(i%3)+1}"><div class="pair"><div>${T().before}</div><div>${T().after}</div></div><h3>${L(r[1])}</h3></div>`).join("")}</div>`),
 reviews:()=>page("reviews",T().reviewsLead,true,reviewCards()),
 faq:()=>page("faq",T().faqLead,false,`<div class="faq">${faq.map((q,i)=>`<details ${i===0?"open":""} data-r><summary>${L(q[0])}</summary><p>${L(q[1])}</p></details>`).join("")}</div>`),
 cosmetics:()=>page("cosmetics",T().cosLead,true,`<div class="grid3">${products.map((p,i)=>`<div class="tile" data-r="${(i%3)+1}"><div class="wipe">${img(p[0],800)}</div><h3>${L(p[1])}</h3><p>${L(p[2])}</p></div>`).join("")}</div>`),
 contacts:()=>page("contacts",T().contactsLead,false,`<div class="contact cmap">
  <div style="display:grid;gap:30px;align-content:start" data-r><dl class="tbl">
   <div><dt>${T().phone}</dt><dd><button type="button" class="ul copy" data-copy="${PHONE}" title="${T().copyHint}"><span class="v">${PHONE}</span></button></dd></div>
   <div><dt>${T().insta}</dt><dd><a class="ul" href="${IG}" target="_blank" rel="noopener">@kateryna.yaryhina.aesthetic</a></dd></div>
   <div><dt>${T().web}</dt><dd>${SITE}</dd></div>
   <div><dt>${T().addr}</dt><dd>69 Kempster Ave<br>Ottawa, ON K2B 6M2<br>Canada</dd></div>
   <div><dt>${T().hoursL}</dt><dd><span class="hours">${T().hrs.map(h=>`<span>${h[0]}</span><span>${h[1]}</span>`).join("")}</span></dd></div></dl>
   ${draft()}<div style="display:flex;gap:14px;flex-wrap:wrap">${book()}<a class="btn" href="https://www.google.com/maps/search/?api=1&query=69+Kempster+Ave,+Ottawa,+ON+K2B+6M2" target="_blank" rel="noopener">${T().openMap}</a></div></div>
  <figure class="map wipe" data-r="2"><div class="map-fb"><span class="m">KY</span></div><iframe title="KY Aesthetic — 69 Kempster Ave, Ottawa" src="https://maps.google.com/maps?q=69+Kempster+Ave,+Ottawa,+ON+K2B+6M2&z=15&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe><figcaption><span class="cap">KY Aesthetic Studio</span><span>69 Kempster Ave, Ottawa, ON K2B 6M2</span></figcaption></figure></div>`)
};

/* ---------- motion ---------- */
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
let io=null;
function reveal(root){
 const els=root.querySelectorAll("[data-r],[data-rv],.wipe,.tl article");
 if(reduce||!("IntersectionObserver" in window)){document.documentElement.classList.add("no-anim");els.forEach(e=>e.classList.add("in"));return;}
 if(!io)io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.14,rootMargin:"0px 0px -6% 0px"});
 els.forEach(e=>io.observe(e));
}
function cursor(){
 if(reduce||!matchMedia("(pointer:fine)").matches)return;
 const d=document.createElement("div"),r=document.createElement("div");d.className="cur";r.className="cur-ring";document.body.append(d,r);
 let x=innerWidth/2,y=innerHeight/2,rx=x,ry=y;
 addEventListener("mousemove",e=>{x=e.clientX;y=e.clientY;d.style.transform=`translate(${x}px,${y}px)`;});
 document.addEventListener("mouseover",e=>r.classList.toggle("hov",!!e.target.closest("a,button,summary,label")));
 (function loop(){rx+=(x-rx)*.16;ry+=(y-ry)*.16;r.style.transform=`translate(${rx}px,${ry}px)`;requestAnimationFrame(loop);})();
}

const hdr=document.getElementById("hdr"),ov=document.getElementById("overlay"),mo=document.getElementById("menuOpen");
function cur(){const h=location.hash.slice(1);return PAGES.includes(h)?h:"home";}
let cIdx=-1;
function openCert(i){const box=document.getElementById("lbox");const vis=certs.filter(c=>cfil==="all"||c[1]===cfil);if(i<0)return;cIdx=i;const c=certs[i];
 box.querySelector("img").src=csrc(c[0]);box.querySelector("img").alt=L(c[2]);box.querySelector(".lt").textContent=L(c[2]);box.querySelector(".lm").textContent=c[3]+" · "+L(c[4]);
 box.hidden=false;document.body.style.overflow="hidden";}
function stepCert(d){const vis=certs.map((c,i)=>i).filter(i=>cfil==="all"||certs[i][1]===cfil);const p=vis.indexOf(cIdx);openCert(vis[(p+d+vis.length)%vis.length]);}
function closeCert(){const box=document.getElementById("lbox");box.hidden=true;document.body.style.overflow="";cIdx=-1;}
function copyText(b){const txt=b.dataset.copy,v=b.querySelector(".v");
 const ok=()=>{if(b._t)clearTimeout(b._t);v.textContent=T().copied+" ✓";b.classList.add("done");b._t=setTimeout(()=>{v.textContent=txt;b.classList.remove("done")},1600)};
 const fb=()=>{try{const ta=document.createElement("textarea");ta.value=txt;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;opacity:0;top:0;left:0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,99);const r=document.execCommand("copy");ta.remove();if(r)ok()}catch(e){}};
 try{if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,fb);else fb()}catch(e){fb()}}
function bindForm(){const f=document.getElementById("cform");if(!f)return;f.addEventListener("submit",e=>{e.preventDefault();const n=document.getElementById("f-note"),em=document.getElementById("f-email");n.hidden=false;if(!/\S+@\S+\.\S+/.test(em.value)){n.textContent=T().formReq;em.focus();return;}n.textContent=T().formNote;});}
function render(){
 const p=cur();document.documentElement.lang=lang;
 document.getElementById("navl").innerHTML=T().navMain.map(k=>`<a class="ul" href="#${k}" ${k===p?'aria-current="page"':""}>${T().nav[k]}</a>`).join("");
 document.getElementById("fullNav").innerHTML=PAGES.map((k,i)=>`<a href="#${k}" ${k===p?'aria-current="page"':""}><small>${String(i+1).padStart(2,"0")}</small>${T().nav[k]}</a>`).join("");
 document.getElementById("fnav").innerHTML=PAGES.map(k=>`<a href="#${k}">${T().nav[k]}</a>`).join("");
 document.getElementById("fcon").innerHTML=`<dt>${T().phoneL}</dt><dd>${PHONE}</dd><dt>${T().igL}</dt><dd><a class="ul" href="${IG}" target="_blank" rel="noopener">@kateryna.yaryhina.aesthetic</a></dd><dt>${T().locL}</dt><dd>${T().loc}</dd>`;
 document.getElementById("bookTop").textContent=T().book;
 document.getElementById("menuClose").setAttribute("aria-label",T().close);
 ["en","ru"].forEach(l=>document.getElementById("l-"+l).setAttribute("aria-pressed",String(l===lang)));
 const app=document.getElementById("app");
 app.innerHTML=`<div class="${p==="home"?"":"inner"}">${views[p]()}</div>`;
 app.querySelectorAll("[data-cf]").forEach(b=>b.addEventListener("click",()=>{cfil=b.dataset.cf;render();}));
 app.querySelectorAll("[data-ci]").forEach(b=>b.addEventListener("click",()=>openCert(+b.dataset.ci)));
 app.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.f;render();}));
 app.querySelectorAll("[data-pc]").forEach(b=>b.addEventListener("click",()=>{pcat=b.dataset.pc;render();}));
 app.querySelectorAll("[data-jump]").forEach(a=>a.addEventListener("click",()=>{jump=a.dataset.jump;}));
 bindForm();reveal(app);
 app.querySelectorAll(".copy").forEach(b=>b.addEventListener("click",()=>copyText(b)));
 const hero=document.getElementById("hero");if(hero)requestAnimationFrame(()=>setTimeout(()=>hero.classList.add("in"),preDone?60:900));
}
function closeMenu(){ov.hidden=true;mo.setAttribute("aria-expanded","false");document.body.style.overflow="";mo.focus();}
mo.addEventListener("click",()=>{ov.hidden=false;mo.setAttribute("aria-expanded","true");document.body.style.overflow="hidden";document.getElementById("menuClose").focus();});
document.getElementById("menuClose").addEventListener("click",closeMenu);
ov.addEventListener("click",e=>{if(e.target.closest("a"))closeMenu();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!ov.hidden)closeMenu();});
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;try{localStorage.setItem("ky-lang",lang)}catch(e){}render();}));
document.getElementById("lbox").addEventListener("click",e=>{const a=e.target.closest("[data-lb]");if(a){a.dataset.lb==="x"?closeCert():stepCert(a.dataset.lb==="n"?1:-1);return;}if(e.target.id==="lbox")closeCert();});
(()=>{let x0=null;const lb=document.getElementById("lbox");lb.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});lb.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)stepCert(dx<0?1:-1)},{passive:true});})();
document.addEventListener("keydown",e=>{if(document.getElementById("lbox").hidden)return;if(e.key==="Escape")closeCert();if(e.key==="ArrowRight")stepCert(1);if(e.key==="ArrowLeft")stepCert(-1);});
window.addEventListener("hashchange",()=>{render();const el=jump&&document.getElementById(jump);jump=null;if(el)el.scrollIntoView();else window.scrollTo(0,0);});
let preDone=false;
function finishPre(){if(preDone)return;preDone=true;document.getElementById("pre").classList.add("done");}
setTimeout(finishPre,1300);
render();cursor();
</script>
